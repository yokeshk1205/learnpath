name: learnpath

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnpath}
      POSTGRES_USER: ${POSTGRES_USER:-learnpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnpath}
    ports:
      - "5432:5432"
    volumes:
      - learnpath-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://${POSTGRES_USER:-learnpath}:${POSTGRES_PASSWORD:-learnpath}@postgres:5432/${POSTGRES_DB:-learnpath}
      DATABASE_SSL: "false"
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?AUTH_ACCESS_TOKEN_SECRET is required}
      AUTH_ACCESS_TOKEN_TTL_MINUTES: ${AUTH_ACCESS_TOKEN_TTL_MINUTES:-15}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-learnpath_refresh}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  ml:
    build:
      context: services/ml
      dockerfile: Dockerfile
    environment:
      ML_PORT: 8000
      MODEL_DIRECTORY: /app/models
      SYNTHETIC_DATA_DIRECTORY: /app/data/synthetic
      FEATURE_DATA_DIRECTORY: /app/data/features
      EXPERIMENT_DIRECTORY: /app/models/benefit-ranking-v2
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:4000
      VITE_ML_PROXY_TARGET: http://ml:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
      - ml

volumes:
  learnpath-postgres:
